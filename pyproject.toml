[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "memlend"
version = "0.1.0"
description = "Lend GPU memory, offload only what's needed."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "torch"]  # torch reads __cuda_array_interface__ through numpy
# License: not chosen yet, this is the author's call (see README).

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 119
