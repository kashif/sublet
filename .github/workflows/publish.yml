name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # to publish by hand, e.g. a release made before this workflow existed

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: PyPI trusts this workflow, no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --sdist
      - uses: pypa/gh-action-pypi-publish@release/v1
